<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><title>Portfólio local</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d0f14;color:#eaedf4;padding:40px;max-width:720px;margin:auto}
a{color:#7c9fff} li{margin:8px 0} .ok{color:#6dce8b} .bad{color:#f07178}
</style></head><body>
<h1>Portfólio — neste PC</h1>
<p>Público permanente: <a href="https://ricartefelipe.github.io/">ricartefelipe.github.io</a></p>
<ul id="list"></ul>
<script>
const items = [
  ["AssinaFlow","http://localhost:8080/actuator/health"],
  ["Spring SaaS","http://localhost:8081/actuator/health"],
  ["Order Service","http://localhost:8082/actuator/health"],
  ["Cards API","http://localhost:8083/q/health"],
  ["Comercial API","http://localhost:8084/q/health"],
  ["Comercial UI","http://localhost:3005/"],
  ["Oficina","http://localhost:8085/api/actuator/health"],
  ["FIAPx","http://localhost:8086/api/actuator/health"],
  ["SpringMind","http://localhost:8087/actuator/health"],
  ["VueMind API","http://localhost:8088/actuator/health"],
  ["Node Orders","http://localhost:3000/"],
  ["Py Payments","http://localhost:8000/docs"],
  ["Estapar","http://localhost:3003/actuator/health"],
  ["HookGuard","http://localhost:9080/"],
  ["FileNorm","http://localhost:9081/"],
  ["WarRoom","http://localhost:9082/"]
];
const ul = document.getElementById('list');
items.forEach(async ([name,url]) => {
  const li = document.createElement('li');
  li.innerHTML = name + ' — <a href="'+url+'">'+url+'</a> ';
  ul.appendChild(li);
  try {
    await fetch(url, {mode:'no-cors'});
    li.innerHTML += '<span class="ok">probe enviado</span>';
  } catch { li.innerHTML += '<span class="bad">?</span>'; }
});
</script>
</body></html>
